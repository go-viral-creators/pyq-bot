<!doctype html>
<html><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1024px;height:500px;overflow:hidden;background:#0A0A12;font-family:'Inter','Segoe UI',Arial,sans-serif;color:#fff}
  .stage{position:relative;width:1024px;height:500px;overflow:hidden;
    background:
      radial-gradient(520px 380px at 12% 0%, rgba(124,92,255,.55), transparent 70%),
      radial-gradient(560px 420px at 100% 100%, rgba(34,211,238,.45), transparent 70%),
      linear-gradient(135deg,#0B0A1A,#0A0A12 60%,#06141A)}
  .copy{position:absolute;left:56px;top:92px;width:520px}
  .pill{display:inline-flex;gap:8px;align-items:center;padding:7px 14px;border-radius:99px;font-size:15px;font-weight:600;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#cfe9ff;margin-bottom:20px}
  .dot{width:8px;height:8px;border-radius:50%;background:#34D399;box-shadow:0 0 10px #34D399}
  h1{font-size:60px;line-height:1.02;font-weight:800;letter-spacing:-1.8px}
  h1 span{background:linear-gradient(90deg,#9B83FF,#22D3EE);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin-top:18px;font-size:23px;line-height:1.35;color:#b9bfd8;font-weight:500}
  .brand{position:absolute;left:56px;bottom:34px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px;color:#e9ebff}
  .brand img{width:36px;height:36px;border-radius:10px}
  /* phone */
  .phone{position:absolute;right:70px;top:34px;width:270px;height:560px;border-radius:40px;background:#12121C;
    border:3px solid #2b2b44;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.04) inset;transform:rotate(7deg)}
  .screen{position:absolute;inset:10px;border-radius:30px;background:#0E0E18;overflow:hidden}
  .top{height:54px;background:#1B1B2B;display:flex;align-items:center;gap:10px;padding:0 14px}
  .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#7C5CFF,#22D3EE)}
  .top b{font-size:13px}.top small{display:block;font-size:10px;color:#34D399}
  .msg{margin:12px 12px 0;padding:9px 12px;border-radius:14px 14px 14px 4px;background:#1E1E30;font-size:12px;width:150px;color:#dfe2f5}
  .msg.me{margin-left:auto;border-radius:14px 14px 4px 14px;background:#2A1F6B}
  .voice{display:flex;align-items:center;gap:7px;margin:12px 12px 0 auto;width:178px;padding:9px 12px;border-radius:14px 14px 4px 14px;background:#2A1F6B}
  .voice i{width:3px;border-radius:2px;background:#9B83FF;display:block}
  .bars{display:flex;gap:2px;align-items:center;height:26px}
  .voice em{font-style:normal;font-size:10px;color:#cdbfff}
  .play{width:0;height:0;border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
  .input{position:absolute;left:12px;right:12px;bottom:14px;height:34px;border-radius:17px;background:#1B1B2B}
  .bubble{position:absolute;right:20px;top:300px;width:72px;height:72px}
  .ring{position:absolute;inset:-18px;border-radius:50%;border:3px solid rgba(255,92,147,.5)}
  .ring.r2{inset:-34px;border-color:rgba(255,92,147,.25)}
  .disc{position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,#7C5CFF,#FF5C93);box-shadow:0 10px 30px rgba(124,92,255,.6)}
  .disc svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  .tag{position:absolute;right:104px;top:262px;padding:7px 12px;border-radius:99px;background:rgba(16,16,24,.92);font-size:12px;font-weight:700;white-space:nowrap}
  /* waveform before/after card */
  .card{position:absolute;z-index:5;left:548px;top:300px;width:215px;padding:14px 16px;border-radius:18px;background:rgba(18,18,30,.78);
    border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);box-shadow:0 18px 40px rgba(0,0,0,.4)}
  .card small{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
  .wave{display:flex;gap:2px;align-items:center;height:30px;margin:6px 0 10px}
  .wave i{display:block;width:3px;border-radius:2px}
</style></head>
<body><div class="stage">
  <div class="copy">
    <div class="pill"><span class="dot"></span>100% on-device AI</div>
    <h1>Studio-quality<br><span>voice notes.</span></h1>
    <p>Hold the floating mic. Background noise vanishes. Sent automatically.</p>
  </div>
  <div class="brand"><img alt="" src="__ICON__"> AuraMic AI</div>

  <div class="card">
    <small style="color:#FF5C93">Before</small>
    <div class="wave" id="w1"></div>
    <small style="color:#22D3EE">After</small>
    <div class="wave" id="w2"></div>
  </div>

  <div class="phone"><div class="screen">
    <div class="top"><div class="av"></div><div><b>Aarav</b><small>online</small></div></div>
    <div class="msg">Can you send me the details?</div>
    <div class="msg me">Sure, voice note incoming</div>
    <div class="voice"><div class="play"></div><div class="bars" id="vb"></div><em>0:12</em></div>
    <div class="input"></div>
  </div></div>
  <div class="tag">&#9679; 0:07 &nbsp;◀ slide to cancel</div>
  <div class="bubble" style="right:96px;top:318px">
    <div class="ring r2"></div><div class="ring"></div>
    <div class="disc"><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5.3-3a5.3 5.3 0 0 1-10.6 0H5a7 7 0 0 0 6 6.72V21h2v-3.28A7 7 0 0 0 19 11z"/></svg></div>
  </div>
</div>
<script>
  function bars(el, hs, color){ hs.forEach(h=>{const i=document.createElement('i'); i.style.height=h+'px'; i.style.background=color; el.appendChild(i)}) }
  let seed=7; const r=()=> (seed=(seed*16807)%2147483647)/2147483647;
  const noisy=[...Array(46)].map((_,k)=> Math.round(8+ r()*20 + (k%9<4? r()*6:0)));
  const clean=[...Array(46)].map((_,k)=> { const env=Math.sin(k/46*Math.PI*3.2)**2; return Math.round(3+ env*24 + (k%11==0? 3:0)) });
  bars(document.getElementById('w1'), noisy, '#FF5C93');
  bars(document.getElementById('w2'), clean, '#22D3EE');
  bars(document.getElementById('vb'), [6,12,20,10,22,16,8,20,14,7,18,11,6].map(x=>x), '#9B83FF');
</script></body></html>
